<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="otel-sdk-node as a trace waterfall: GET /checkout with child spans for auth, a Postgres query and a payments API call. A Redis span is missing because the module was imported before sdk.start() and never patched. Every Pino log line is stamped with trace_id and span_id." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.mo{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}.sa{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}.se{font-family:Georgia,"Times New Roman",serif}.bl{font-family:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif}
.in{opacity:0;animation:in .5s ease-out forwards}@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.dr{stroke-dasharray:1600;stroke-dashoffset:1600;animation:dr 2.2s ease-in-out forwards}@keyframes dr{to{stroke-dashoffset:0}}
.grow{transform:scaleX(0);animation:grow .6s ease-out forwards}@keyframes grow{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style>
<rect width="1200" height="500" fill="#0b0d12"/>
<text x="56" y="76" class="sa" font-size="40" font-weight="700" fill="#f0f3f6">otel-sdk-node</text>
<text x="56" y="106" class="sa" font-size="16" fill="#8b949e">OpenTelemetry wiring for Node. One trace ID reconstructs the whole request.</text>
<g class="mo" font-size="12" fill="#6e7681"><text x="380" y="156">0 ms</text><text x="1140" y="156" text-anchor="end">trace</text></g><line x1="380" x2="1140" y1="164" y2="164" stroke="#21262d"/>
<text x="60" y="191" class="mo" font-size="15" fill="#e6edf3">GET /checkout</text><rect x="380" y="174" width="760" height="24" rx="4" fill="#6e40c9" class="grow" style="animation-delay:0.00s;transform-origin:380px 0"/><text x="82" y="239" class="mo" font-size="15" fill="#e6edf3">auth middleware</text><rect x="400" y="222" width="120" height="24" rx="4" fill="#8957e5" class="grow" style="animation-delay:0.35s;transform-origin:400px 0"/><text x="82" y="287" class="mo" font-size="15" fill="#e6edf3">pg: SELECT order</text><rect x="530" y="270" width="210" height="24" rx="4" fill="#1f6feb" class="grow" style="animation-delay:0.70s;transform-origin:530px 0"/><text x="82" y="335" class="mo" font-size="15" fill="#e6edf3">http: payments api</text><rect x="750" y="318" width="300" height="24" rx="4" fill="#1f6feb" class="grow" style="animation-delay:1.05s;transform-origin:750px 0"/><text x="82" y="383" class="mo" font-size="15" fill="#8b949e">redis: SET session</text><rect x="560" y="366" width="180" height="24" rx="4" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="6 5"/><text x="760" y="383" class="mo in" style="animation-delay:2s" font-size="14" fill="#f85149">imported before sdk.start(): no span</text>
<g class="in" style="animation-delay:2.4s"><rect x="56" y="420" width="1088" height="44" rx="8" fill="#161b22" stroke="#30363d"/><text x="76" y="448" class="mo" font-size="14" fill="#8b949e">{"msg":"order paid", <tspan fill="#d2a8ff">"trace_id":"…"</tspan>, <tspan fill="#79c0ff">"span_id":"…"</tspan>}   ← stamped on every Pino log line</text></g></svg>